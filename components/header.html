    <div class="flex items-center gap-4">
      <p class="text-lg font-extrabold tracking-tight text-brand-900">Qualyquimy</p>
      <span class="hidden sm:inline-flex rounded-full bg-green-100 px-2 py-1 text-xs font-semibold text-green-800">
        13 anos no mercado
      </span>
    </div>
    
    <nav class="hidden md:flex items-center gap-8">
      <a href="#produtos" class="text-slate-600 hover:text-brand-600 transition-colors">Produtos</a>
      <a href="#servicos" class="text-slate-600 hover:text-brand-600 transition-colors">Serviços</a>

      <a href="#contato" class="text-slate-600 hover:text-brand-600 transition-colors">Contato</a>
    </nav>
    
    <div class="flex items-center gap-4">
      <a href="tel:1146432301" class="hidden sm:flex items-center gap-2 text-slate-600 hover:text-brand-600 transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        (11) 4643-2301
      </a>
      
      <a href="#comprar" class="rounded-xl bg-brand-500 px-5 py-3 text-sm font-bold text-white shadow-lg transition hover:bg-brand-600">
        Solicitar Agora
      </a>
      
      <button class="md:hidden rounded-lg p-2 text-slate-600 hover:bg-slate-100" id="mobile-menu-toggle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
    </div>
  </div>
  
  <!-- Mobile Menu -->
  <div id="mobile-menu" class="hidden md:hidden border-t border-slate-200 bg-white">
    <nav class="flex flex-col gap-4 px-6 py-4">
      <a href="#produtos" class="text-slate-600 hover:text-brand-600 transition-colors">Produtos</a>
      <a href="#servicos" class="text-slate-600 hover:text-brand-600 transition-colors">Serviços</a>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>

        (11) 4643-2301
      </a>
    </nav>
  </div>
</header>

<script>
// Mobile menu functionality
document.addEventListener('DOMContentLoaded', function() {
  const toggle = document.getElementById('mobile-menu-toggle');
  const menu = document.getElementById('mobile-menu');
  
  if (toggle && menu) {
    toggle.addEventListener('click', function() {
      menu.classList.toggle('hidden');
      toggle.setAttribute('aria-expanded', menu.classList.contains('hidden') ? 'false' : 'true');
    });
    
    // Close menu when clicking outside
    document.addEventListener('click', function(e) {
      if (!toggle.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.add('hidden');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
    
    // Close menu on escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  }
});
</script>
