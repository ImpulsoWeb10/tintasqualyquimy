<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Supremo Qualy Quimy</title>
<meta name="description" content="Painel de geração de conteúdos da Tintas Qualy Quimy para canais de venda e divulgação.">
<link rel="canonical" href="/index.html">
<link rel="stylesheet" href="/assets/css/global.css">
</head>

<body class="dashboard-page">

<main class="dashboard-wrap">

<h1 class="dashboard-title">PAINEL SUPREMO DE ANÚNCIOS</h1>
<p class="dashboard-subtitle">Geração centralizada de pacote para Shopee, landing page, WhatsApp e social.</p>

<div class="toolbar">
<input id="produtoInput" placeholder="Digite o produto (ex: grafiato)">
<button onclick="gerar()">CRIAR PACOTE</button>
</div>

<div class="panel-grid">

<div class="panel-box">
<h2>Shopee</h2>
<div id="shopeePreview" class="preview"></div>
</div>

<div class="panel-box">
<h2>Landing Page</h2>
<div id="landingPreview" class="preview"></div>
</div>

<div class="panel-box">
<h2>WhatsApp</h2>
<div id="whatsPreview" class="preview"></div>
</div>

<div class="panel-box">
<h2>Social / Reel</h2>
<div id="socialPreview" class="preview"></div>
</div>

</div>

</main>

<script>

function gerar(){

let produto=document.getElementById("produtoInput").value;

if(!produto){
alert("Digite o produto");
return;
}

// preview na tela
document.getElementById("shopeePreview").innerText="Gerando...";
document.getElementById("landingPreview").innerText="Gerando...";
document.getElementById("whatsPreview").innerText="Gerando...";
document.getElementById("socialPreview").innerText="Gerando...";

// envio pro servidor
fetch("/gerar", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({ produto })
})
.then(res => res.json())
.then(() => {
  alert("🔥 PACOTE CRIADO NAS PASTAS!");
});

}

</script>
<script src="/assets/js/site.js" defer></script>

</body>
</html>
