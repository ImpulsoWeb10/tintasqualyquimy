<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COPY CHIEF | Agente de Conteúdo Tintas Qualy Quimy</title>
    <meta name="description" content="Agente de IA para geração de conteúdo de marketing para Tintas Qualy Quimy">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Fixo -->
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="empresa-info">
                    <span class="empresa-nome">🎨 Tintas Qualy Quimy</span>
                    <span class="separador">|</span>
                    <a href="https://wa.me/5511954950044" class="whatsapp-link">
                        📞 (11) 95495-0044
                    </a>
                    <span class="separador">|</span>
                    <span class="endereco">📍 Rua Leiria, 45 — Itaquaquecetuba - SP</span>
                </div>
            </div>
        </div>
        <div class="header-main">
            <div class="container">
                <div class="logo">
                    <h1>COPY <span>CHIEF</span></h1>
                    <span class="badge">Agente de Conteúdo</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main">
        <div class="container">
            <div class="layout-grid">
                <!-- Formulário à Esquerda -->
                <div class="form-section">
                    <div class="form-card">
                        <h2>📝 Dados do Produto</h2>
                        
                        <form id="form-produto">
                            <div class="form-group">
                                <label for="nome">Nome do Produto *</label>
                                <input type="text" id="nome" placeholder="Ex: Grafiato Texturizado Premium" required>
                            </div>

                            <div class="form-group">
                                <label for="embalagem">Embalagem *</label>
                                <input type="text" id="embalagem" placeholder="Ex: Balde 25kg, Galão 3,6L, Lata 18L" required>
                            </div>

                            <div class="form-group">
                                <label for="rendimento">Rendimento *</label>
                                <input type="text" id="rendimento" placeholder="Ex: 300m² por demão, 15m²/L" required>
                            </div>

                            <div class="form-group">
                                <label for="onde_usar">Onde Usar *</label>
                                <textarea id="onde_usar" rows="4" placeholder="Ex: Paredes internas e externas, fachadas, áreas de alto tráfego, ambientes úmidos..." required></textarea>
                            </div>

                            <div class="form-group">
                                <label>Tipos de Saída</label>
                                <div class="toggle-buttons">
                                    <button type="button" class="toggle-btn ativo" data-tipo="instagram">
                                        📸 Instagram
                                    </button>
                                    <button type="button" class="toggle-btn ativo" data-tipo="whatsapp">
                                        💬 WhatsApp
                                    </button>
                                    <button type="button" class="toggle-btn ativo" data-tipo="landing_page">
                                        🌐 Landing Page
                                    </button>
                                </div>
                            </div>

                            <button type="button" id="btn-gerar" class="btn-primary">
                                <span id="spinner" class="spinner" style="display: none;"></span>
                                <span id="btn-texto">⚡ GERAR CONTEÚDO</span>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Resultados à Direita -->
                <div class="results-section">
                    <div class="results-header">
                        <h2>📄 Resultados Gerados</h2>
                    </div>
                    
                    <div id="output-area" class="output-area">
                        <div class="placeholder">
                            <p>🚀 Preencha os dados do produto e clique em "GERAR CONTEÚDO" para criar materiais profissionais de marketing.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast de Notificação -->
    <div id="toast" class="toast"></div>

    <!-- JavaScript -->
    <script src="app.js"></script>
</body>
</html>
